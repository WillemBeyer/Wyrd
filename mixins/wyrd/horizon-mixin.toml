[mod]
id = "wyrd"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "wyrd"
source = "runtime.rs"

[[injection]]
id = "before-break"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::break_block"
helper = "break.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
]

[[injection]]
id = "list-native-mod"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "diagnostic-command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "remember-mined-block"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::mine_block_with_held"
helper = "memory.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "block", ty = "&str", value = "name" },
]

[[injection]]
id = "deepslate-mining-progress"
kind = "RETURN"
target = "horizon_client::game::hand::Game<'_>::destroy_progress"
helper = "mining_bonus.rs"
bindings = [
  { name = "progress", ty = "f32", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
]

[[injection]]
id = "iron-memory-drop"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::block_loot_at"
helper = "iron_bonus.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "state", ty = "crate::game::BlockStateId", value = "state" },
  { name = "held", ty = "Option<&crate::game::ItemStack>", value = "held" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
]

[[injection]]
id = "pickaxe-memory-effects"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::stations::Game<'_>::draw_stack_tooltip_with"
variable = { name = "lines", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "effects_tooltip.rs"
bindings = [
  { name = "lines", ty = "Vec<(horizon_client::text::Text, u32)>", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&crate::game::ItemStack", value = "stack" },
]

[[injection]]
id = "sync-pickaxe-memory"
kind = "RETURN"
target = "horizon_client::lan::guest::stack_to_network"
helper = "sync_memory.rs"
bindings = [
  { name = "network", ty = "Option<Stack>", value = "$value" },
  { name = "local", ty = "&Option<ItemStack>", value = "s" },
]
